<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<script src="/matlab.js"></script>
<script src="/indiflight.js"></script>
<script src="/attachments.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --txt:#1d2733; --mute:#6b7785; --acc:#1f6feb; --ok:#1a7f37; --warn:#9a6700; --warnbg:#fff8c5; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#16202c; color:#fff; padding:14px 24px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header .meta { color:#9fb0c3; font-size:12px; }
  main { max-width:none; width:100%; margin:0; padding:16px 12px 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:20px; overflow:hidden; }
  #summary { color:var(--mute); font-size:13px; }
  .foot { margin:10px 0 0; justify-content:space-between; }
  .scroll { overflow-x:auto; }
  button { font:inherit; background:var(--sec); color:var(--txt); border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
  input[type=search] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; width:280px; }
  table { width:max-content; min-width:100%; border-collapse:collapse; }
  table.log td, table.log th { white-space:nowrap; }
  table.log td { max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  table.log td.detail { max-width:none; overflow:visible; white-space:normal; }
  button:disabled { opacity:.5; cursor:default; }
  select { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
  .mono { font-family:ui-monospace, monospace; font-size:12px; }
  td.num { color:var(--mute); }
  .mute { color:var(--mute); }
  .bar { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .bar[hidden] { display:none; }
  a { color:var(--acc); }
  .parse-notice { margin:0 0 12px; padding:8px 12px; border-radius:6px; background:var(--warnbg); color:var(--warn); display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; }
  .parse-notice a { margin-left:auto; }
  .parse-notice[hidden] { display:none; }
  a.btn { display:inline-block; background:var(--btn); color:#fff; padding:6px 12px; border-radius:6px; text-decoration:none; }
  a.btn.sec { background:var(--sec); color:var(--txt); }
  a.btn[hidden] { display:none; }
  /* row backgrounds (normal, day row, ticked, opened, hover; night mode through the theme's colours) */
  tr.flight, tr.group { cursor:pointer; --row-bg:var(--card); background:var(--row-bg); }
  tr.flight.open { --row-bg:var(--detail); }
  tr.flight.ticked, tr.group.ticked { --row-bg:color-mix(in srgb, var(--acc) 9%, var(--card)); }
  tr.flight:hover { --row-bg:var(--hover); }
  tr.group { font-weight:600; }
  tr.sub td:nth-child(3) { padding-left:24px; }
  /* a day group: tinted with a bar on the left; its flights keep a lighter bar when it is open */
  tr.group { --row-bg:color-mix(in srgb, var(--acc) 6%, var(--card)); box-shadow:inset 3px 0 0 var(--acc); }
  tr.group.ticked { --row-bg:color-mix(in srgb, var(--acc) 12%, var(--card)); }
  tr.group:hover { --row-bg:color-mix(in srgb, var(--acc) 11%, var(--card)); }
  tr.sub { box-shadow:inset 3px 0 0 color-mix(in srgb, var(--acc) 45%, transparent); }
  .grp-count { display:inline-block; min-width:2.2em; padding:1px 7px; border-radius:10px; font-size:12px; font-weight:600;
    background:color-mix(in srgb, var(--acc) 16%, transparent); color:var(--acc); text-align:center; white-space:nowrap; }
  .detail { background:var(--detail); padding:12px 16px; }
  .detail h4 { margin:12px 0 6px; }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; }
  .cols { display:flex; gap:40px; flex-wrap:wrap; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .minimap { height:240px; max-width:640px; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; }
  .flight-detail { display:grid; grid-template-columns:minmax(0,640px) minmax(200px,1fr); gap:16px; width:min(1100px,calc(100vw - 80px)); }
  .flight-detail .minimap { max-width:none; margin:0; }
  .detail-info { min-width:0; }
  .detail-info h4 { margin-top:0; }
  @media (max-width:760px) { .flight-detail { grid-template-columns:minmax(0,1fr); } }
  td.chk, th.chk { width:28px; padding-right:0; }
  .lb-menu .ext-item[aria-checked="true"] { font-weight:600; }
  .lb-menu .ext-item[aria-checked="true"]::before { content:"✓ "; }
  .lb-menu { position:absolute; z-index:1000; padding:6px; min-width:180px; }
  .lb-menu[hidden] { display:none; }
  .lb-menu .ext-item { color:var(--txt); }
  .lb-menu a.ext-item { text-decoration:none; }
  .lb-menu label.ext-item { cursor:pointer; }
  .lb-menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  td.exp, th.exp { width:18px; padding-right:0; color:var(--mute); }
  .times { text-decoration:underline dotted var(--mute); text-underline-offset:3px; cursor:help; }
  .note { white-space:pre-wrap; max-width:640px; overflow-wrap:anywhere; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .warn { color:var(--err); }
  .date-unknown { background:var(--warnbg); color:var(--warn); font-weight:400; }
  .no-flight { background:var(--chip, var(--sec)); color:var(--mute); margin-left:4px; }
  tr.nolog { cursor:default; }
  tr.nolog td { color:var(--mute); }
  .date-estimated { text-decoration:underline dotted var(--warn); text-underline-offset:3px; cursor:help; }
  .date-estimated .date-tip { display:none; position:fixed; left:16px; bottom:16px; z-index:1000;
    max-width:min(420px,calc(100vw - 32px)); padding:8px 12px; border:1px solid var(--line);
    border-radius:6px; background:var(--card); color:var(--txt); white-space:normal; font-weight:400;
    box-shadow:0 2px 8px #0003; pointer-events:none; }
  .date-estimated:hover .date-tip, .date-estimated:focus .date-tip { display:block; }
  .col-menu { position:relative; }
  .col-menu form { position:absolute; top:calc(100% + 6px); left:0; z-index:1000; min-width:200px; padding:10px 12px;
    border:1px solid var(--line); border-radius:6px; background:var(--card); box-shadow:0 2px 8px #0003;
    display:grid; grid-template-columns:1fr 1fr; gap:2px 16px; }
  .col-menu form[hidden] { display:none; }
  .col-menu label { white-space:nowrap; }
  .col-menu .col-actions { grid-column:1 / -1; display:flex; justify-content:space-between; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>Logbook</h1>
  <span class="meta" id="nav"></span>
  <span class="meta" style="margin-left:auto"><span id="who"></span> <button type="button" id="nightBtn" onclick="toggleNight()"><span class="when-day">Night</span><span class="when-night">Day</span></button> <button style="padding:2px 8px" onclick="logout()">Sign out</button></span>
</header>
<main>
  <div id="parseNotice" class="parse-notice" role="status" hidden></div>
  <section class="card">
    <div class="bar">
      <input type="search" id="q" placeholder="Filter (aircraft, pilot, goal, date, reference, file name, #number…)">
      <label title="One row per aircraft, crew, day and takeoff location, like a paper daily log. Expand a row for its flights."><input type="checkbox" id="combine" checked> Group by day</label>
      <input type="hidden" id="filesFilter" value="">
      <span class="col-menu" id="filesWrap"><button type="button" id="filesBtn" aria-haspopup="menu" aria-expanded="false"
          title="Only entries with additional files (of a category)">Files ▾</button>
        <span id="filesChip" class="filter-chip" hidden><button type="button" id="filesChipLabel" aria-haspopup="menu" aria-expanded="false"
            title="Change the files filter"></button><button type="button" aria-label="Clear the files filter" title="Show all entries" onclick="setFiles('')">✕</button></span>
        <div id="filesMenu" class="ext-pop lb-menu" role="menu" hidden style="left:0;top:calc(100% + 6px)"></div></span>
      <span class="col-menu"><button type="button" id="colButton" aria-expanded="false" aria-controls="colForm">Columns</button>
        <form id="colForm" hidden aria-label="Shown columns"></form></span>
      <span id="hiddenChip" class="filter-chip" hidden title="Only hidden entries are shown; restore them with the selection bar"><span style="padding:4px 0">Hidden records only</span>
        <button type="button" aria-label="Show the logbook again" title="Show the logbook again" onclick="setHiddenOnly(false)">✕</button></span>
      <span id="bulkMsg" class="mute"></span>
      <span class="col-menu" id="manageWrap" style="margin-left:auto" hidden><button type="button" id="manageBtn" aria-haspopup="menu" aria-expanded="false">Manage ▾</button>
        <div id="manageMenu" class="ext-pop lb-menu" role="menu" hidden style="right:0;left:auto;top:calc(100% + 6px)">
          <a class="ext-item" role="menuitem" href="/historical/new" id="addHistorical" hidden>Import CSV</a>
          <a class="ext-item" role="menuitem" href="/review" id="reviewLink" hidden title="Paper records and logs that need a person to decide">Review</a>
          <label class="ext-item" role="menuitemcheckbox" id="hiddenFilter" hidden title="Entries hidden from the logbook and totals; tick them to restore them"><input type="checkbox" id="hiddenRecords" onchange="setHiddenOnly(this.checked)"> Hidden records only</label>
        </div></span>
    </div>
    <div class="scroll">
    <table class="log">
      <thead><tr><th class="exp" aria-label="Expand"></th><th class="chk"><input type="checkbox" id="selAll" title="Select all on this page" aria-label="Select all on this page"></th><th title="Flight number: the number in /flight/&lt;number&gt;, used by ml.fetch in Python and pprz_fetch in MATLAB (⧉ copies it)">No.</th><th>Date (UTC)</th><th>Takeoff</th><th>Landing</th><th>Flights</th><th>Duration</th><th title="Distance flown along the path">Flown</th><th>Source</th><th>Aircraft</th><th>Project</th><th title="Operator registration the flight was flown under">Operator</th><th title="Operation category and authorisation the flight was flown under">Category</th><th>Takeoff location</th><th>Landing location</th>
        <th>PIC</th><th>PAC</th><th>GCS</th><th>Goal</th><th>Comment</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <div class="bar foot">
      <span id="summary"></span>
      <div class="bar" style="margin:0">
        <button type="button" onclick="exportCsv()">Export CSV</button>
        <span class="mute">Rows per page</span>
        <select id="size"><option>10</option><option selected>15</option><option>25</option><option>50</option><option>100</option></select>
        <div id="logbookPages" class="navigation-pages"></div>
      </div>
    </div>
    <div id="selBar" class="sel-bar" hidden role="region" aria-label="Selected entries">
      <strong id="selCount"></strong>
      <button type="button" id="selCopy">Copy numbers</button>
      <span id="selMatlab"></span>
      <button type="button" id="bulkChange" hidden onclick="openBulk()" title="Project, crew, operator or category of the ticked entries">Change…</button>
      <button type="button" id="sameFlightBtn" hidden onclick="sameFlight()" title="The ticked entries are recordings of one flight: logged flights, optionally with one paper record">Same flight</button>
      <button type="button" id="hideSelected" hidden onclick="setHidden(true)">Hide</button>
      <button type="button" id="restoreSelected" hidden onclick="setHidden(false)">Restore</button>
      <button type="button" class="x" id="selClear" title="Clear the selection">Clear</button>
    </div>
  </section>
</main>
<dialog class="entry-dialog" id="bulkDialog" aria-labelledby="bulkTitle" onkeydown="if(event.key==='Escape'){event.preventDefault();this.close();}">
  <div class="dialog-header"><h2 id="bulkTitle">Change the ticked entries</h2><button type="button" onclick="$('bulkDialog').close()">Close</button></div>
  <form id="bulkForm" onsubmit="event.preventDefault(); applyBulk()">
    <p class="mute" id="bulkWhat" style="margin:0"></p>
    <label class="field">Project<select id="bulkProject"></select></label>
    <label class="field">PIC<select id="bulkPic"></select></label>
    <label class="field">PAC<select id="bulkPac"></select></label>
    <label class="field">GCS<select id="bulkGcs"></select></label>
    <label class="field" title="The operator registration the flights were flown under">Operator<select id="bulkOperator" onchange="pickNewOperator(this, operators, fillBulkMenus, '__keep__')"></select></label>
    <label class="field" title="The rules the flights were flown under: OPEN, SPECIFIC with its authorisation, national rules before 2021">Category<select id="bulkCategory"></select></label>
    <p class="dialog-error" id="bulkError" role="alert"></p>
    <div class="row"><button type="submit" class="primary">Apply</button> <button type="button" class="sec" onclick="$('bulkDialog').close()">Cancel</button></div>
  </form>
</dialog>
<dialog class="entry-dialog" id="actDialog" aria-labelledby="actTitle" onkeydown="if(event.key==='Escape'){event.preventDefault();this.close();}">
  <div class="dialog-header"><h2 id="actTitle"></h2><button type="button" onclick="$('actDialog').close()">Close</button></div>
  <form id="actForm">
    <p class="mute" id="actWhat" style="margin:0"></p>
    <div id="actFields" class="dialog-fields"></div>
    <p class="dialog-error" id="actError" role="alert"></p>
    <div class="row"><button type="submit" class="primary" id="actSave">Save</button> <button type="button" class="sec" id="actExtra" hidden></button> <button type="button" class="sec" onclick="$('actDialog').close()">Cancel</button></div>
  </form>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDur = s => s == null ? '' : `${Math.floor(s/60)}m ${String(Math.round(s%60)).padStart(2,'0')}s`;
const fmtDist = m => m == null ? '' : m >= 1000 ? `${(m / 1000).toFixed(m >= 10000 ? 1 : 2)} km` : `${Math.round(m)} m`;
const fmtDate = t => (t || '').slice(0, 10);
const fmtHm = t => (t || '').slice(11, 16);
const fmtTime = t => (t || '').replace('T', ' ').slice(0, 19);
let flights = [], page = 0, pageSize = 15, me = null, projects = [], people = [], operators = [], authorisations = [];
const selected = new Set();
const openGroups = new Set();
const exportable = f => MatlabExport.available(f.sources);
// Every entry can be ticked (paper records too); the selection bar then offers what applies to all ticked entries.
const selectable = () => true;
const selectOn = () => !hiddenColumns.has('Select');  // the tick-box column can be switched off under Columns
const pickedFlights = () => flights.filter(f => crewIds(f).some(id => selected.has(id)));
// Logs without flights (non-flights, shown unless "Hide non-flights"): parsed logs that produced no flight, as
// rows of their own (GET /api/logbook/logs-without-flights, the Logs page's scope); key "nolog:<log id>".
let noFlightLogs = [], noFlightLoaded = false;
const asLogRow = l => ({...l, nolog: true, record_key: 'nolog:' + l.id, log_id: l.id, aircraft: l.aircraft_names || l.name,
  takeoff_utc: l.date_ok ? l.start_utc : null, log_start_utc: l.start_utc});
async function loadNoFlightLogs() {
  if (!window.flightFilters.state.nonflights) return;
  try {
    const r = await fetch('/api/logbook/logs-without-flights');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not load the logs without flights');
    noFlightLogs = d.logs.map(asLogRow);
    noFlightLoaded = true;
  } catch (error) { $('bulkMsg').textContent = error.message; }
}
const pickedLogs = () => noFlightLogs.filter(l => selected.has(l.record_key));
const logSource = l => ({log_id: l.id, flight_id: null, log_type: l.log_type, log_name: l.name, flights: 0});
// per ticked logbook entry the flight ids of its recordings; the server exports the SD one, else the GCS one
const matlabEntries = () => pickedFlights().filter(exportable).map(f => f.sources.map(s => s.flight_id)).sort((a, b) => a[0] - b[0]);

const realFetch = window.fetch;
window.fetch = async (...args) => {
  const r = await realFetch(...args);
  if (r.status === 401) location.href = '/login';
  return r;
};
fetch('/api/me').then(r => r.json()).then(async d => {
  me = d.user;
  $('who').textContent = d.user.display_name + (d.user.is_admin ? ' (admin)' : '');
  [projects, people, operators, authorisations] = await Promise.all([
    fetch('/api/projects').then(r => r.json()),
    fetch('/api/people').then(r => r.json()),
    fetch('/api/operators').then(r => r.json()).then(d => d.operators),
    fetch('/api/authorisations').then(r => r.json()).then(d => d.authorisations),
  ]);
  fillBulkMenus();
  syncEditUi();
  loadFlights();
  checkParsing();
});
async function loadFlights() {
  const generation = ++loadGeneration;
  pathCache.clear();
  try {
    loadLogbookFiles();
    const withoutFlights = loadNoFlightLogs();
    const r = await fetch('/api/logbook?compact=1' + ($('hiddenRecords').checked ? '&hidden=1' : ''));
    const d = await r.json();
    await withoutFlights;
    if (generation !== loadGeneration) return;
    if (!r.ok) throw new Error(d.error || 'Could not load the logbook');
    flights = d;
    const available = new Set([...flights.flatMap(crewIds), ...noFlightLogs.map(l => l.record_key)]);
    for (const id of selected) if (!available.has(id)) selected.delete(id);
    syncEditUi();
    render();
  } catch (error) { if (generation === loadGeneration) $('bulkMsg').textContent = error.message; }
}
let loadGeneration = 0;

// While logs wait for (re-)parsing the logbook is not final: re-parsed logs show their previous results and new
// uploads are missing. The notice checks every 10 s and reloads the logbook once the queue is empty.
let parseNoticeTimer = null;
async function checkParsing() {
  clearTimeout(parseNoticeTimer);
  let st;
  try { st = await fetch('/api/status').then(r => r.ok ? r.json() : null); } catch (e) { st = null; }
  const c = st?.counts || {};
  const pending = (c.queued || 0) + (c.parsing || 0), total = Object.values(c).reduce((a, b) => a + b, 0);
  const wasShown = !$('parseNotice').hidden;
  $('parseNotice').hidden = !pending;
  if (pending) {
    $('parseNotice').innerHTML = `<strong>Parsing logs:</strong> ${pending} of ${total} logs are still waiting or being parsed;
      results may change and new uploads appear when they are done. <a href="/logs">Logs</a>`;
    parseNoticeTimer = setTimeout(checkParsing, 10000);
  } else if (wasShown) {
    loadFlights();
  }
}

const entityLink = (kind, id, name) => id != null ? `<a href="/${kind}/${id}">${esc(name)}</a>` : esc(name);
const place = (lat, lon, name, id) => id != null ? entityLink('locations', id, name) : lat == null ? (name ? esc(name) : '<span class="mute" title="No GPS fix">no GPS</span>') :
  `<a ${name ? '' : 'class="mono" '}target="_blank" rel="noopener" title="${lat.toFixed(5)}, ${lon.toFixed(5)}" href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=16/${lat}/${lon}">${esc(name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`)}</a>`;
const person = (f, role) => {
  const u = f[role + '_user'], raw = f[role];
  if (u) return entityLink('people', u.id, u.display_name);
  return raw ? esc(raw) : '';
};
const crewIds = f => f.manual_id ? [`paper:${f.manual_id}`] : [...new Set([f.flight_id, ...(f.sources || []).map(s => s.flight_id)].filter(id => id != null))].map(id => `log:${id}`);
function fillBulkMenus() {
  const opts = '<option value="__keep__">Keep</option><option value="">From log / none</option>'
    + people.map(p => `<option value="${p.id}">${esc(p.display_name)}</option>`).join('');
  ['bulkPic', 'bulkPac', 'bulkGcs'].forEach(id => { if ($(id)) $(id).innerHTML = opts; });
  const addable = projects.filter(p => me && (me.is_admin || p.can_add));
  if ($('bulkProject')) {
    $('bulkProject').innerHTML = '<option value="__keep__">Keep</option><option value="">No project</option>'
      + addable.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  }
  $('bulkOperator').innerHTML = '<option value="__keep__">Keep</option><option value="">From project / place / PIC / own</option>'
    + operators.map(o => `<option value="${o.id}">${esc(operatorLabel(o))}</option>`).join('') + NEW_OPERATOR_OPTION;
  $('bulkCategory').innerHTML = '<option value="__keep__">Keep</option><option value="">From project / place / date</option>'
    + categoryOptions(authorisations, '__keep__');
}
// Operation category (#62): set on the flight is shown plainly, inferred is muted, (check) when it needs a look.
// Only the category is shown; the authorisation and where the category came from are in the tooltip.
function categoryCell(f) {
  const check = f.category_check ? ` <span class="warn" title="${esc(f.category_check)}">(check)</span>` : '';
  const title = [f.authorisation_name, CATEGORY_SOURCE[f.category_source] || 'no rule applies'].filter(Boolean).join(' · ');
  const label = f.category === 'national' ? 'National rules' : CATEGORY_LABELS[f.category] || 'Unknown';
  return `<span${f.category_source === 'flight' ? '' : ' class="mute"'} title="${esc(title)}">${esc(label)}</span>${check}`;
}

// Column visibility is a per-browser preference, so it survives page changes, Back and new sessions.
const COLUMNS = ['No.', 'Date (UTC)', 'Takeoff', 'Landing', 'Flights', 'Duration', 'Flown', 'Source', 'Aircraft', 'Project',
  'Operator', 'Category', 'Takeoff location', 'Landing location', 'PIC', 'PAC', 'GCS', 'Goal', 'Comment'];
const COLUMNS_KEY = 'logbook.hiddenColumns';
let hiddenColumns = new Set();
try { hiddenColumns = new Set(JSON.parse(localStorage.getItem(COLUMNS_KEY) || '[]').filter(c => c === 'Select' || COLUMNS.includes(c))); } catch (e) {}
const columnStyle = document.head.appendChild(document.createElement('style'));
function applyColumns() {
  // Column n+3 in each row: first the expand arrow, then the tick box (Select, column 2). Expanded detail rows span all columns.
  columnStyle.textContent = (hiddenColumns.has('Select') ? 'table.log tr > :nth-child(2):not(.detail) { display:none; }\n' : '')
    + COLUMNS.map((c, i) => hiddenColumns.has(c)
    ? `table.log tr > :nth-child(${i + 3}):not(.detail) { display:none; }` : '').join('\n');
  if (hiddenColumns.has('Select') && selected.size) { selected.clear(); if (flights.length) render(); }

function loadMiniMap(el) {

  if (!pathCache.has(id)) pathCache.set(id, fetch(`/api/flights/${id}/path`).then(async r => {
    if (!r.ok) throw new Error(`Could not load path (${r.status}).`);
    const p = await r.json();
    const points = p.points || p;
    if (!Array.isArray(points)) throw new Error('Invalid path response.');
    const segments = [];
    let segment = null, previous = null;
    for (const point of points) {
      const position = point?.position;
      if (!position || !Number.isFinite(position.lat) || !Number.isFinite(position.lon)
          || Math.abs(position.lat) > 90 || Math.abs(position.lon) > 180
          || (position.lat === 0 && position.lon === 0)) {
        segment = null;
        previous = null;
        continue;
      }
      if (!segment || point.time_s - previous.time_s > 5) {
        segment = [];
        segments.push(segment);
      }
      segment.push([position.lat, position.lon]);
      previous = point;
    }
    return segments;
  }));

    if (!el.isConnected) return;

    el.textContent = '';
    const first = segments[0][0], last = segments[segments.length - 1].slice(-1)[0];
    const m = L.map(el, {scrollWheelZoom: false}).setView(first, 15);
    miniMaps.push(m);

    const group = L.featureGroup().addTo(m);
    for (const segment of segments) {
      if (segment.length > 1) L.polyline(segment, {color: '#1f6feb', weight: 3}).addTo(group);
      else L.circleMarker(segment[0], {radius: 3, color: '#1f6feb', fillOpacity: 1}).addTo(group);
    }
    L.circleMarker(first, {radius: 4, color: '#1f6feb', fillOpacity: .9})
      .bindTooltip('First recorded position').addTo(group);

      .bindTooltip('Last recorded position').addTo(group);
    m.fitBounds(group.getBounds().pad(0.15), {maxZoom: 19});
  }).catch(error => {
    if (pathCache.get(id) === pending) pathCache.delete(id);
    if (!el.isConnected) return;
    el.className = 'mute';
    el.textContent = error.message + ' ';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = 'Retry path';
    retry.onclick = () => {
      el.className = 'minimap';
      el.textContent = 'Loading path...';
      loadMiniMap(el);
    };
    el.appendChild(retry);
  });
}

const km = (a, b) => {
  const r = Math.PI / 180, dLat = (b.takeoff_lat - a.takeoff_lat) * r, dLon = (b.takeoff_lon - a.takeoff_lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.takeoff_lat * r) * Math.cos(b.takeoff_lat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
};

// Group by day: one row per aircraft, crew, UTC day and takeoff place, like a paper daily log. The PIC must be
// the same; an empty PAC or GCS matches a name, two different names do not. Logged flights share a place at the
// same named location, within 1 km of the day's first takeoff, or when neither has a position (indoor flights
// without GPS). Paper flight records group with each other at the same named location, never with logs; paper
// daily totals already cover a day.
const DAY_GROUP_KM = 1;
// Flights with a set date but no time (date_override only) sort and group by that date, as the server orders them.
const when = f => f.takeoff_utc || (f.date_override ? f.date_override + 'T00:00:00Z' : '');
// Flights without a takeoff time (e.g. Blackbox logs with only a date) share a time: then the log file name in natural
// order (LOG00015 before LOG00018) and the flight number in the log decide, not the order the logs were parsed in.
const byName = (a, b) => (a.log_name || '').localeCompare(b.log_name || '', undefined, {numeric: true, sensitivity: 'base'})
  || (a.idx ?? 0) - (b.idx ?? 0);
const inOrder = (a, b) => when(a).localeCompare(when(b)) || byName(a, b);
const crewName = (f, r) => f[r + '_user'] ? 'u' + f[r + '_user'].id : f[r] ? 'n' + f[r].toLowerCase() : '';
const groupable = f => f.date_ok && (f.manual_id ? f.record_kind !== 'daily' && f.takeoff_place_id != null : true);
const hasPosition = f => f.takeoff_lat != null && f.takeoff_lon != null;
function samePlace(a, b) {
  if (a.takeoff_place_id != null && b.takeoff_place_id != null) return a.takeoff_place_id === b.takeoff_place_id;
  if (a.manual_id) return false;
  if (hasPosition(a) && hasPosition(b)) return km(a, b) <= DAY_GROUP_KM;
  return !hasPosition(a) && !hasPosition(b);  // both without GPS: the same unknown place
}
const crewFits = (g, f) => crewName(f, 'pic') === g.crew.pic
  && ['pac', 'gcs'].every(r => !g.crew[r] || !crewName(f, r) || g.crew[r] === crewName(f, r));
function combine(list) {
  const groups = [];
  for (const f of [...list].sort(inOrder)) {
    const key = [f.manual_id ? 'paper' : 'log', f.drone_id ?? f.aircraft, fmtDate(when(f)), !!f.simulation?.detected, !!f.date_estimated].join('|');
    const g = groupable(f) && groups.find(g => g.key === key && groupable(g.flights[0]) && samePlace(g.flights[0], f) && crewFits(g, f));
    if (g) {
      g.flights.push(f);
      for (const r of ['pac', 'gcs']) g.crew[r] ||= crewName(f, r);
    } else groups.push({key, flights: [f], crew: Object.fromEntries(['pic', 'pac', 'gcs'].map(r => [r, crewName(f, r)]))});
  }
  for (const g of groups) {
    const fl = g.flights, last = fl[fl.length - 1];
    g.id = fl[0].record_key;
    g.duration_s = fl.reduce((s, f) => s + (f.duration_s || 0), 0);
    g.distance_m = fl.some(f => f.distance_m != null) ? fl.reduce((s, f) => s + (f.distance_m || 0), 0) : null;
    g.max_from_takeoff_m = fl.reduce((s, f) => Math.max(s, f.max_from_takeoff_m || 0), 0);
    g.landing_utc = last.landing_utc;
    g.landing_lat = last.landing_lat; g.landing_lon = last.landing_lon; g.landing_place = last.landing_place;
    g.landing_place_id = last.landing_place_id;
    const uniq = k => [...new Set(fl.map(f => f[k]).filter(Boolean))];
    g.goals = uniq('goal');
    g.comments = uniq('comment');
  }
  return groups.sort((a, b) => inOrder(b.flights[0], a.flights[0]));
}

const TYPE_LABEL = {onboard_sd: 'SD', gcs: 'GCS', px4_ulog: 'PX4', ardupilot: 'ArduPilot', mavlink_tlog: 'tlog',
  betaflight: 'Betaflight', indiflight: 'INDIFlight', blackbox: 'Blackbox'};
const srcLabel = fl => fl.some(f => f.manual_id) ? (fl[0].record_kind === 'daily' ? 'Paper daily total' : 'Paper') + (fl.some(f => f.possible_duplicates?.length) ? ' · possible duplicate' : '')
  : ['onboard_sd', 'px4_ulog', 'ardupilot', 'betaflight', 'indiflight', 'mavlink_tlog', 'gcs'].filter(t => fl.some(f => (f.sources || []).some(s => s.log_type === t))).map(t => TYPE_LABEL[t]).join(' + ')
    + (fl.some(f => f.linked_records?.length) ? ' + Paper' : '') + (fl.some(f => f.conflicts?.some(c => !c.reviewed_by)) ? ' · conflict' : '');
const verdictMark = f => (f.simulation?.detected ? ' <span class="mute">(Simulation)</span>' : '') + (f.verdict === 'ground' ? ' <span class="mute" title="Probably not a real flight">(ground)</span>'
  : f.verdict === 'uncertain' ? ' <span class="mute" title="Unsure whether this was a real flight">(?)</span>' : '')
  + (f.link_warning ? ` <span class="mute" title="Datalink: ${esc(f.link_warning)}">(link)</span>` : '')
  + (f.optitrack ? (!f.external_positioning || f.external_positioning === 'OptiTrack'
    ? ' <span class="mute" title="OptiTrack or motion-capture pose in this log">(OptiTrack)</span>'
    : ` <span class="mute" title="Motion capture / external navigation in this log: ${esc(f.external_positioning)}">(motion capture)</span>`) : '')
  + (f.indoor && !f.optitrack ? ' <span class="mute" title="Takeoff or landing is inside a named indoor place, or no good GPS fix">(indoor)</span>' : '');
function dateTd(f) {
  // who may set the date clicks the chip itself; for others it stays a plain chip
  const warn = !f.date_ok && f.can_edit_date && !f.manual_id
    ? `<button type="button" class="badge date-unknown" data-set-date="${esc(f.record_key)}" title="Click to set the date (this log has no usable calendar date, often GPS week 0, shown as 1980)">date unknown</button>`
    : '<span class="badge date-unknown" title="This log has no usable calendar date (often GPS week 0, shown as 1980)">date unknown</span>';
  const date = f.date_ok ? esc(fmtDate(f.takeoff_utc) || f.date_override || '') : warn;
  const explanation = 'Estimated from GPS time-of-week and firmware commit; calendar week uncertain.';
  const label = f.date_estimated && f.date_ok
    ? `<span class="date-estimated" tabindex="0" aria-label="${esc(fmtDate(f.takeoff_utc) || f.date_override || '')}: ${explanation}">${date}<span class="date-tip" aria-hidden="true">${explanation}</span></span>`
    : date;
  return `<td>${label}</td>`;
}
async function setLogDate(logId, value, out) {

    body: JSON.stringify({date_override: value || null})});
  if (!r.ok) { out.textContent = ((await r.json().catch(() => ({}))).error) || 'Could not save the date'; return false; }
  return true;
}
const timesTip = o => o.times ? ` class="times" title="${esc(o.times)}"` : '';
// Flight number (as in /flight/<number> and pprz_fetch): the recording the flight page opens; the other recordings
// of the same flight (SD and GCS log) in the tooltip. Empty for paper records and for a day with several flights.
// A day group shows its number of flights ("4×") where a flight shows its number, with a button that copies the

function numberTd(f, o) {
  if (o.group && o.count > 1) {

    return `<td class="num"><span class="grp-count" title="${o.count} flights in this row${numbers ? ': ' + esc(numbers) : ''}">${

  const tip = ids.length > 1 ? ` title="Recordings: ${esc((f.sources || []).map(s => `${s.flight_id} (${TYPE_LABEL[s.log_type] || s.log_type})`).join(', '))}"` : '';
  return `<td class="num mono"><span${tip}>${f.flight_id}</span>${window.copyButton(f.flight_id, `flight number ${f.flight_id}`)}</td>`;
}
const cells = (f, o, landingPlaceId) => `<td class="exp">${o.group ? (o.open ? '▾' : '▸') : ''}</td>${chk(o.ids)}${numberTd(f, o)}${dateTd(f)}<td><span${timesTip(o)}>${esc(fmtHm(f.takeoff_utc))}</span></td><td><span${timesTip(o)}>${esc(fmtHm(o.landing_utc)) || '<span class="mute">–</span>'}</span></td>
    <td>${o.count}</td><td>${fmtDur(o.duration_s)}</td><td>${fmtDist(o.distance_m)}</td><td>${o.sources}</td><td><span${f.aircraft_uid ? ` title="${esc(f.aircraft_uid)}"` : ''}>${entityLink('aircraft', f.drone_id, f.aircraft)}</span>${verdictMark(f)}</td>
    <td>${o.project}</td><td>${operatorCell(f)}</td><td>${categoryCell(f)}</td>
    <td>${place(f.takeoff_lat, f.takeoff_lon, f.takeoff_place, f.takeoff_place_id)}</td><td>${place(o.landing_lat, o.landing_lon, o.landing_place, landingPlaceId)}</td>
    <td>${person(f, 'pic')}</td><td>${person(f, 'pac')}</td><td>${person(f, 'gcs')}</td><td>${esc(o.goal)}</td><td>${esc(o.comment)}</td>`;

function flightRows(f, cls = '') {
  const ids = crewIds(f);
  return `<tr class="flight ${cls}${open_.has(f.record_key) ? ' open' : ''}${ticked(ids) ? ' ticked' : ''}" data-id="${f.record_key}">${cells(f, {landing_utc: f.landing_utc, count: cls ? '' : (f.flight_count || 1), sources: srcLabel([f]), duration_s: f.duration_s, distance_m: f.distance_m, max_from_takeoff_m: f.max_from_takeoff_m, landing_lat: f.landing_lat, landing_lon: f.landing_lon, landing_place: f.landing_place, goal: f.goal, comment: f.comment, project: projectCell(f), ids, canEdit: selectable(f)}, f.landing_place_id)}</tr>`
    + (open_.has(f.record_key) ? `<tr><td colspan="21" class="detail">${detail(f)}</td></tr>` : '');

// A log without flights: its date (or the date chip), start and end, duration, type with a "no flight" chip, aircraft
// and project; the log name links to its details on the Logs page.
function logRow(l) {
  const ids = [l.record_key];
  const date = l.date_ok ? esc(fmtDate(l.start_utc) || l.date_override || '') : l.can_edit_date
    ? `<button type="button" class="badge date-unknown" data-set-date="${esc(l.record_key)}" title="Click to set the date (this log has no usable calendar date, often GPS week 0, shown as 1980)">date unknown</button>`
    : '<span class="badge date-unknown" title="This log has no usable calendar date (often GPS week 0, shown as 1980)">date unknown</span>';
  return `<tr class="flight nolog${ticked(ids) ? ' ticked' : ''}" data-id="${esc(l.record_key)}"><td class="exp"></td>${chk(ids)}<td class="num"></td>
    <td>${date}</td><td>${esc(fmtHm(l.start_utc))}</td><td>${esc(fmtHm(l.end_utc)) || '<span class="mute">–</span>'}</td><td>0</td>
    <td>${fmtDur(l.duration_s)}</td><td></td>
    <td>${esc(TYPE_LABEL[l.log_type] || l.log_type || 'Log')}<span class="badge no-flight" title="This log was parsed but produced no flight">no flight</span></td>
    <td>${esc(l.aircraft_names || '')}</td><td>${l.project_id != null ? `<a href="/projects/${l.project_id}">${esc(l.project_name || '')}</a>` : ''}</td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td><a href="/logs#log${l.id}" title="Log details: ${esc(l.name)}">${esc(l.name)}</a></td></tr>`;
}

function groupRows(g) {
  if (g.flights.length === 1) return flightRows(g.flights[0]);
  const isOpen = openGroups.has(g.id);
  const first = {...g.flights[0]};
  for (const r of ['pac', 'gcs']) if (!first[r] && !first[r + '_user']) {
    const named = g.flights.find(f => f[r] || f[r + '_user']);
    if (named) Object.assign(first, {[r]: named[r], [r + '_user']: named[r + '_user']});
  }
  const times = g.flights.map(f => `${fmtHm(f.takeoff_utc)}–${fmtHm(f.landing_utc) || '?'}`).join(', ');
  const ids = [...new Set(g.flights.flatMap(crewIds))];
  const flightIds = g.flights.map(f => f.flight_id).filter(id => id != null);
  return `<tr class="group${ticked(ids) ? ' ticked' : ''}" data-gid="${g.id}">${cells(first, {group: true, open: isOpen, flightIds, times: 'Flights: ' + times, landing_utc: g.landing_utc, count: g.flights.length, sources: srcLabel(g.flights), duration_s: g.duration_s, distance_m: g.distance_m, max_from_takeoff_m: g.max_from_takeoff_m, landing_lat: g.landing_lat, landing_lon: g.landing_lon, landing_place: g.landing_place, goal: g.goals.join(', '), comment: g.comments.join(' · '), project: groupProject(g, first), ids, canEdit: g.flights.some(selectable)}, g.landing_place_id)}</tr>`
    + (isOpen ? g.flights.map(f => flightRows(f, 'sub')).join('') : '');
}

// The selection bar: what can be done with the ticked entries. Copy and MATLAB for everyone; Change… and Same flight
// only when the user may change every ticked entry; Hide/Restore for admins (the server checks all of it again).
function renderSelBar() {
  const picked = pickedFlights(), logs = pickedLogs(), count = picked.length + logs.length;
  $('selBar').hidden = !count || !selectOn();
  if (!count) return;
  $('selCount').textContent = `${count} selected`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  // an action that does not apply to every ticked entry is disabled, with the reason in its tooltip
  const allow = (el, why) => {
    if (el.dataset.title === undefined) el.dataset.title = el.title;  // its own tooltip, back once it applies again
    el.disabled = !!why;
    el.title = why || el.dataset.title;
  };
  const noNumber = picked.filter(f => f.flight_id == null).length + logs.length;
  if (!copiedTimer) $('selCopy').textContent = 'Copy numbers';
  $('selCopy').dataset.title = `Copy the flight numbers (${selectedNumbers().join(', ')}), e.g. into ml.fetch([…]) in Python or pprz_fetch([…]) in MATLAB`;
  allow($('selCopy'), noNumber ? `${plural(noNumber, 'ticked entry has', 'ticked entries have')} no flight number (paper records, logs without flights); untick ${noNumber === 1 ? 'it' : 'them'} to copy the numbers` : '');
  const noLog = picked.filter(f => !exportable(f)).length + logs.filter(l => !MatlabExport.available([logSource(l)])).length;
  if (logs.length && !noLog && (picked.length || logs.length > 1)) {
    $('selMatlab').innerHTML = '<button type="button" disabled title="MATLAB of a log without flights: tick it on its own">MATLAB ▾</button>';
  } else if (logs.length && !noLog) {
    $('selMatlab').innerHTML = MatlabExport.button([logSource(logs[0])]);  // the whole log
  } else if (noLog) {
    $('selMatlab').innerHTML = `<button type="button" disabled title="${esc(`${plural(noLog, 'ticked entry has', 'ticked entries have')} no Paparazzi log to export; untick ${noLog === 1 ? 'it' : 'them'} for MATLAB`)}">MATLAB ▾</button>`;
  } else {
    $('selMatlab').innerHTML = MatlabExport.bulkButton(matlabEntries, () => 0);
  }
  const locked = picked.filter(f => !f.can_edit_crew).length;
  // Change… and Same flight only for who may change entries at all; disabled when some ticked ones are not theirs
  const changer = !!me?.is_admin || flights.some(f => f.can_edit_crew);
  $('bulkChange').hidden = $('sameFlightBtn').hidden = !changer;
  allow($('bulkChange'), logs.length && picked.length ? 'Logs without flights only change their project: tick them on their own'
    : logs.some(l => !l.can_edit_project) ? "Only administrators change a log's project"
    : locked ? `You may not change ${locked} of the ticked entries` : '');
  const papers = picked.filter(f => f.manual_id).length;
  allow($('sameFlightBtn'), logs.length ? 'Logs without flights have no flight to join'
    : locked ? `You may not change ${locked} of the ticked entries`
    : count < 2 ? 'Tick two or more entries of one flight'
    : papers > 1 ? 'At most one paper record can be part of one flight'
    : papers === count ? 'Tick at least one logged flight' : '');
  $('hideSelected').hidden = !me?.is_admin || $('hiddenRecords').checked;
  $('restoreSelected').hidden = !me?.is_admin || !$('hiddenRecords').checked;
  allow($('hideSelected'), logs.length ? 'Hide applies to flights and paper records; untick the logs without flights' : '');
}

function closeMenus() {

}
// One small dialog (the date of an undated log): fields, then Save runs the action and reloads the logbook.
function actDialog(title, what, fields, save, extra) {
  $('actTitle').textContent = title;
  $('actWhat').textContent = what;
  $('actFields').innerHTML = fields;
  $('actError').textContent = '';
  $('actExtra').hidden = !extra;

    $('actExtra').textContent = extra[0];

  }
  $('actForm').onsubmit = async event => {

  $('actFields').querySelector('select, input')?.focus();

const describe = list => list.length === 1

addEventListener('resize', closeMenus);
function render() {
  const q = $('q').value.trim().toLowerCase();
  const shown = flights.filter(f => window.flightFilters.includes(f) && filesMatch(f) && (!q || q.split(/\s+/).every(w => text(f).includes(w))));
  // newest first as the server sends them (by takeoff, else the log's start); equal times by log name and number
  const latest = f => f.takeoff_utc || f.log_start_utc || '';
  let entries = $('combine').checked ? combine(shown)
    : [...shown].sort((a, b) => latest(b).localeCompare(latest(a)) || byName(b, a)).map(f => ({flights: [f], id: f.record_key}));
  // logs without flights: same period and search, not with a Files filter or among hidden records; by date with the rest
  const logText = l => [l.name, l.aircraft_names, l.project_name, TYPE_LABEL[l.log_type] || l.log_type, 'no flight',
    l.date_ok ? fmtDate(l.start_utc) : 'date unknown', l.date_override].join(' ').toLowerCase();
  const shownLogs = window.flightFilters.state.nonflights && !$('filesFilter').value && !$('hiddenRecords').checked
    ? noFlightLogs.filter(l => window.flightFilters.includesDate(l) && (!q || q.split(/\s+/).every(w => logText(l).includes(w)))) : [];
  if (shownLogs.length) {
    const key = e => e.log ? latest(e.log) : latest(e.flights[0]);
    entries = [...entries, ...shownLogs.map(l => ({log: l, id: l.record_key}))].sort((a, b) => key(b).localeCompare(key(a)));
  }
  const pages = Math.max(1, Math.ceil(entries.length / pageSize));
  page = Math.min(page, pages - 1);
  const visible = entries.slice(page * pageSize, (page + 1) * pageSize);
  window.viewState.pager($('logbookPages'), page, pageSize, entries.length, n => { page = n; window.viewState.save(true); render(); });
  $('rows').innerHTML = visible.map(e => e.log ? logRow(e.log) : groupRows(e)).join('');
  const pageIds = [...new Set(visible.flatMap(e => e.log ? [e.log.record_key] : (e.flights || []).filter(selectable).flatMap(crewIds)))];
  $('selAll').checked = pageIds.length > 0 && pageIds.every(id => selected.has(id));
  $('selAll').disabled = !pageIds.length;
  renderSelBar();
  $('selAll').onchange = () => { toggleSel(pageIds, $('selAll').checked); };
  const total = shown.reduce((s, f) => s + (f.duration_s || 0), 0);
  const dist = shown.some(f => f.distance_m != null) ? shown.reduce((s, f) => s + (f.distance_m || 0), 0) : null;
  $('summary').textContent = `${shown.reduce((s, f) => s + (f.flight_count || 1), 0)} flights` + ($('combine').checked ? ` · ${entries.length} rows` : '') + ` · ${fmtDur(total)} · ${dist == null ? 'No recorded distance' : fmtDist(dist) + ' recorded distance'}`
    + (shownLogs.length ? ` · ${shownLogs.length} ${shownLogs.length === 1 ? 'log' : 'logs'} without flights` : '');
  initMiniMaps();
  initFiles();
  window.viewState.ready();
  return shown;
}

$('rows').onclick = e => {
  if (e.target.closest('a, button, select, input, textarea')) return;
  const gr = e.target.closest('tr.group');
  if (gr) { const id = gr.dataset.gid; openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id); render(); return; }
  const tr = e.target.closest('tr.flight');
  if (!tr || tr.classList.contains('nolog')) return;
  const id = tr.dataset.id;
  open_.has(id) ? open_.delete(id) : open_.add(id);
  render();
};

function exportCsv() {
  const cols = ['flight_id', 'source_type', 'simulation', 'flight_count', 'record_kind', 'reference', 'takeoff_utc', 'landing_utc', 'date_ok', 'date_estimated', 'date_override', 'duration_s', 'distance_m', 'from_takeoff_m', 'max_from_takeoff_m', 'aircraft', 'aircraft_uid', 'project_name', 'operator_name', 'operator_registration', 'operator_source', 'category_label', 'authorisation_name', 'category_source', 'category_check', 'takeoff_place', 'takeoff_lat', 'takeoff_lon', 'landing_place', 'landing_lat', 'landing_lon', 'pic', 'pic_user', 'pac', 'pac_user', 'gcs', 'gcs_user', 'goal', 'comment'];
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [cols.join(',')].concat(render().map(f => cols.map(c => cell(c === 'simulation' ? f.simulation?.detected : c.endsWith('_user') ? f[c]?.display_name : f[c])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'logbook.csv';
  a.click();
}

// The ticked flights' numbers (the one each flight page opens), sorted and comma-separated, so they paste into both
// MATLAB and Python arrays. Paper records have no number.
const selectedNumbers = () => [...new Set(pickedFlights().map(f => f.flight_id).filter(id => id != null))].sort((a, b) => a - b);
let copiedTimer = null;
$('selCopy').onclick = async () => {
  const numbers = selectedNumbers(), text = numbers.join(', ');
  if (!await window.copyText(text)) { prompt('Copy the flight numbers:', text); return; }
  $('selCopy').textContent = `Copied ${numbers.length}`;
  clearTimeout(copiedTimer);
  copiedTimer = setTimeout(() => { copiedTimer = null; $('selCopy').textContent = 'Copy numbers'; }, 2000);
};
$('selClear').onclick = () => { selected.clear(); $('bulkMsg').textContent = ''; render(); };
$('q').oninput = () => { page = 0; window.viewState.save(); render(); };
$('combine').onchange = () => { page = 0; window.viewState.save(true); render(); };

document.addEventListener('attachmentsuploaded', loadLogbookFiles);  // the general Upload added files
window.addEventListener('flightfilterschange', async () => {
  selected.clear(); page = 0; window.viewState.save(true);
  if (window.flightFilters.state.nonflights && !noFlightLoaded) await loadNoFlightLogs();
  render();
});
window.addEventListener('pageshow', event => {
  if (event.persisted) { selected.clear(); render(); }
});
$('size').onchange = () => { pageSize = +$('size').value; page = 0; window.viewState.save(true); render(); };
window.viewState.setup((p, extra) => {
  page = window.viewState.integer(p.get('page'), 1) - 1;
  const value = p.get('size') || '15';
  const size = [...$('size').options].some(o => o.value === value) ? value : '15';
  $('size').value = size; pageSize = +size;
  $('q').value = p.get('q') || '';
  $('combine').checked = p.get('group') !== 'none';
  $('hiddenRecords').checked = p.get('hidden') === '1';
  wantedFiles = p.get('files') || '';  // applied once the categories are loaded
  $('filesFilter').value = filesChoices.some(([value]) => value === wantedFiles) ? wantedFiles : '';
  syncFiles();
  selected.clear();
  open_.clear(); (extra.open || []).forEach(id => open_.add(id));
  openGroups.clear(); (extra.groups || []).forEach(id => openGroups.add(id));
}, p => {
  const set = window.viewState.set;
  set(p,'page',page+1,1); set(p,'size',pageSize,15); set(p,'q',$('q').value);
  set(p,'group',$('combine').checked ? 'day' : 'none','day');
  set(p,'hidden',$('hiddenRecords').checked ? '1' : '');
  set(p,'files',$('filesFilter').value || wantedFiles);
  return {open:[...open_], groups:[...openGroups]};
}, loadFlights);
</script>
</body>
</html>
