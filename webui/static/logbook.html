<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flight logbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --txt:#1d2733; --mute:#6b7785; --acc:#1f6feb; --ok:#1a7f37; --warn:#9a6700; --warnbg:#fff8c5; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#16202c; color:#fff; padding:14px 24px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header .meta { color:#9fb0c3; font-size:12px; }
  main { max-width:none; width:100%; margin:0; padding:16px 12px 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:20px; overflow:hidden; }
  #summary { color:var(--mute); font-size:13px; }
  .foot { margin:10px 0 0; justify-content:space-between; }
  .scroll { overflow-x:auto; }
  button { font:inherit; background:var(--sec); color:var(--txt); border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
  input[type=search] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; width:280px; }
  table { width:max-content; min-width:100%; border-collapse:collapse; }
  table.log td, table.log th { white-space:nowrap; }
  table.log td { max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  table.log td.detail { max-width:none; overflow:visible; white-space:normal; }
  button:disabled { opacity:.5; cursor:default; }
  select { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
  .mono { font-family:ui-monospace, monospace; font-size:12px; }
  .mute { color:var(--mute); }
  .bar { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .bar[hidden] { display:none; }
  a { color:var(--acc); }
  a.btn { display:inline-block; background:var(--btn); color:#fff; padding:6px 12px; border-radius:6px; text-decoration:none; }
  a.btn.sec { background:var(--sec); color:var(--txt); }
  tr.flight, tr.group { cursor:pointer; } tr.flight:hover, tr.group:hover { background:var(--hover); }
  tr.group { background:var(--band); font-weight:600; }
  tr.sub td:nth-child(2) { padding-left:24px; }
  .detail { background:var(--detail); padding:12px 16px; }
  .detail h4 { margin:12px 0 6px; }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; }
  .cols { display:flex; gap:40px; flex-wrap:wrap; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .minimap { height:240px; max-width:640px; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; }
  .flight-detail { display:grid; grid-template-columns:minmax(0,640px) minmax(200px,1fr); gap:16px; width:min(1100px,calc(100vw - 80px)); }
  .flight-detail .minimap { max-width:none; margin:0; }
  .detail-info { min-width:0; }
  .detail-info h4 { margin-top:0; }
  @media (max-width:760px) { .flight-detail { grid-template-columns:minmax(0,1fr); } }
  table.log:not(.editing) .chk { display:none; }
  td.chk, th.chk { width:28px; padding-right:0; }
  .note { white-space:pre-wrap; max-width:640px; overflow-wrap:anywhere; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .warn { color:var(--err); }
  .date-unknown { background:var(--warnbg); color:var(--warn); font-weight:400; }
</style>
</head>
<body data-edit="all">
<header>
  <h1>Flight logbook</h1>
  <span class="meta" id="nav"></span>
  <span class="meta" style="margin-left:auto"><span id="who"></span> <button type="button" id="nightBtn" onclick="toggleNight()"><span class="when-day">Night</span><span class="when-night">Day</span></button> <button style="padding:2px 8px" onclick="logout()">Sign out</button></span>
</header>
<main>
  <section class="card">
    <div class="bar">
      <input type="search" id="q" placeholder="Filter (aircraft, pilot, goal, date, reference…)">
      <label title="Flights of the same aircraft and pilot on the same day within this distance of each other"><input type="checkbox" id="combine" checked> Combine flights (within <input type="number" id="radius" value="1" min="0.1" step="0.5" style="width:56px"> km)</label>
      <button onclick="exportCsv()">Export CSV</button>
      <a class="btn sec" href="/historical/new" id="addHistorical" hidden>Add paper records / import CSV</a>
    </div>
    <div id="bulkBar" class="bar" hidden>
      <label><input type="checkbox" id="selAll"> Select all on this page</label>
      <span class="mute">Apply to selected</span>
      <label>Project <select id="bulkProject"></select></label>
      <label>PIC <select id="bulkPic"></select></label>
      <label>PAC <select id="bulkPac"></select></label>
      <label>GCS <select id="bulkGcs"></select></label>
      <button type="button" onclick="applyBulk()">Apply</button>
      <label id="hiddenFilter" hidden><input type="checkbox" id="hiddenRecords" onchange="selected.clear(); page=0; loadFlights()"> Hidden records only</label>
      <button type="button" id="hideSelected" hidden onclick="setHidden(true)">Hide selected</button>
      <button type="button" id="restoreSelected" hidden onclick="setHidden(false)">Restore selected</button>
      <span id="bulkMsg" class="mute"></span>
    </div>
    <div class="scroll">
    <table class="log">
      <thead><tr><th class="chk"></th><th>Date (UTC)</th><th>Takeoff</th><th>Landing</th><th>Flights</th><th>Duration</th><th title="Distance flown along the path">Flown</th><th>Source</th><th>Aircraft</th><th>Project</th><th>Takeoff location</th><th>Landing location</th>
        <th>PIC</th><th>PAC</th><th>GCS</th><th>Goal</th><th>Comment</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <div class="bar foot">
      <span id="summary"></span>
      <span class="bar" style="margin:0">
        <span class="mute">Rows per page</span>
        <select id="size"><option>10</option><option selected>15</option><option>25</option><option>50</option><option>100</option></select>
        <button id="prev">‹ Previous</button><span id="pageInfo" class="mute"></span><button id="next">Next ›</button>
      </span>
    </div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDur = s => s == null ? '' : `${Math.floor(s/60)}m ${String(Math.round(s%60)).padStart(2,'0')}s`;
const fmtDist = m => m == null ? '' : m >= 1000 ? `${(m / 1000).toFixed(m >= 10000 ? 1 : 2)} km` : `${Math.round(m)} m`;
const fmtDate = t => (t || '').slice(0, 10);
const fmtHm = t => (t || '').slice(11, 16);
const fmtTime = t => (t || '').replace('T', ' ').slice(0, 19);
let flights = [], page = 0, pageSize = 15, me = null, projects = [], people = [];
const selected = new Set();
const openGroups = new Set();

const realFetch = window.fetch;
window.fetch = async (...args) => {
  const r = await realFetch(...args);
  if (r.status === 401) location.href = '/login';
  return r;
};
fetch('/api/me').then(r => r.json()).then(async d => {
  me = d.user;
  $('who').textContent = d.user.display_name + (d.user.is_admin ? ' (admin)' : '');
  [projects, people] = await Promise.all([
    fetch('/api/projects').then(r => r.json()),
    fetch('/api/people').then(r => r.json()),
  ]);
  fillBulkMenus();
  syncEditUi();
  loadFlights();
});
async function loadFlights() {
  const generation = ++loadGeneration;
  pathCache.clear();
  try {
    const r = await fetch('/api/logbook?compact=1' + ($('hiddenRecords').checked ? '&hidden=1' : ''));
    const d = await r.json();
    if (generation !== loadGeneration) return;
    if (!r.ok) throw new Error(d.error || 'Could not load the logbook');
    flights = d;
    const available = new Set(flights.flatMap(crewIds));
    for (const id of selected) if (!available.has(id)) selected.delete(id);
    syncEditUi();
    render();
  } catch (error) { if (generation === loadGeneration) $('bulkMsg').textContent = error.message; }
}
let loadGeneration = 0;

const entityLink = (kind, id, name) => id != null ? `<a href="/${kind}/${id}">${esc(name)}</a>` : esc(name);
const place = (lat, lon, name, id) => id != null ? entityLink('locations', id, name) : lat == null ? (name ? esc(name) : '<span class="mute" title="No GPS fix">no GPS</span>') :
  `<a ${name ? '' : 'class="mono" '}target="_blank" rel="noopener" title="${lat.toFixed(5)}, ${lon.toFixed(5)}" href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=16/${lat}/${lon}">${esc(name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`)}</a>`;
const person = (f, role) => {
  const u = f[role + '_user'], raw = f[role];
  if (u) return entityLink('people', u.id, u.display_name);
  return raw ? esc(raw) : '';
};
const editOn = () => window.editMode();
const crewIds = f => f.manual_id ? [`paper:${f.manual_id}`] : [...new Set([f.flight_id, ...(f.sources || []).map(s => s.flight_id)].filter(id => id != null))].map(id => `log:${id}`);
function crewSelect(f, role, ids) {
  if (!editOn() || !f.can_edit_crew) return person(f, role);
  const u = f[role + '_user'];
  const selectedId = u && (f.manual_id || u.source === 'edit' || u.source === 'alias') ? u.id : '';
  const logged = f[role] ? esc(f[role]) : '—';
  return `<select onclick="event.stopPropagation()" onchange="setCrew(${esc(JSON.stringify(ids))}, '${role}', this.value)">
    ${f.manual_id && role === 'pic' ? '' : `<option value="">${logged}</option>`}
    ${people.map(p => `<option value="${p.id}"${p.id === selectedId ? ' selected' : ''}>${esc(p.display_name)}</option>`).join('')}
  </select>`;
}
function fillBulkMenus() {
  const opts = '<option value="__keep__">Keep</option><option value="">From log / none</option>'
    + people.map(p => `<option value="${p.id}">${esc(p.display_name)}</option>`).join('');
  ['bulkPic', 'bulkPac', 'bulkGcs'].forEach(id => { if ($(id)) $(id).innerHTML = opts; });
  const addable = projects.filter(p => me && (me.is_admin || p.can_add));
  if ($('bulkProject')) {
    $('bulkProject').innerHTML = '<option value="__keep__">Keep</option><option value="">No project</option>'
      + addable.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  }
}
async function setCrew(ids, role, value) {
  if (!await updateRecords(ids, {[role + '_user_id']: value ? +value : null})) return;
  loadFlights();
}
async function updateRecords(ids, changes) {
  try {
    const r = await fetch('/api/logbook/records', {method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({record_keys: ids, ...changes})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not save');
    return true;
  } catch (error) { $('bulkMsg').textContent = error.message; return false; }
}
async function setHidden(hidden) {
  const ids = [...selected];
  if (!ids.length) { $('bulkMsg').textContent = 'Tick the records you want to change.'; return; }
  if (!confirm(hidden
    ? 'Hide the selected entries from the logbook and totals? Source logs and attachments are kept. You can restore these entries using Hidden records only.'
    : 'Restore the selected entries to the logbook and totals?')) return;
  if (!await updateRecords(ids, {hidden})) return;
  selected.clear();
  $('bulkMsg').textContent = hidden ? 'Selected entries hidden.' : 'Selected entries restored.';
  loadFlights();
}
async function applyBulk() {
  const ids = [...selected];
  if (!ids.length) { $('bulkMsg').textContent = 'Tick the flights you want to change.'; return; }
  const body = {};
  [['bulkPic', 'pic_user_id'], ['bulkPac', 'pac_user_id'], ['bulkGcs', 'gcs_user_id']].forEach(([id, key]) => {
    const v = $(id).value;
    if (v !== '__keep__') body[key] = v ? +v : null;
  });
  const projectV = $('bulkProject').value;
  const changeProject = projectV !== '__keep__';
  if (!Object.keys(body).length && !changeProject) {
    $('bulkMsg').textContent = 'Choose a project, PIC, PAC or GCS.';
    return;
  }
  if (changeProject) {
    body.project_id = projectV ? +projectV : null;
  }
  if (!await updateRecords(ids, body)) return;
  $('bulkMsg').textContent = 'Saved.';
  ['bulkProject', 'bulkPic', 'bulkPac', 'bulkGcs'].forEach(id => { $(id).value = '__keep__'; });
  loadFlights();
}
function syncEditUi() {
  $('bulkBar').hidden = !editOn();
  $('hiddenFilter').hidden = !me?.is_admin;
  $('hideSelected').hidden = !me?.is_admin || $('hiddenRecords').checked;
  $('restoreSelected').hidden = !me?.is_admin || !$('hiddenRecords').checked;
  $('addHistorical').hidden = !(me && (me.is_admin || projects.some(p => p.role === 'full')));
  $('addHistorical').textContent = me?.is_admin ? 'Add paper records / import CSV' : 'Add paper record';
}
function toggleEdit() {
  syncEditUi();
  if (!editOn()) {
    selected.clear(); $('bulkMsg').textContent = '';
    if ($('hiddenRecords').checked) { $('hiddenRecords').checked = false; loadFlights(); }
  }
  render();
}
function toggleSel(ids, on) {
  ids.forEach(id => on ? selected.add(id) : selected.delete(id));
  render();
}
function chk(ids, can) {
  if (!editOn() || !can) return '<td class="chk"></td>';
  const all = ids.length > 0 && ids.every(id => selected.has(id));
  return `<td class="chk"><input type="checkbox" ${all ? 'checked' : ''} onclick="event.stopPropagation(); toggleSel(${esc(JSON.stringify(ids))}, this.checked)"></td>`;
}
const text = f => [f.takeoff_place, f.landing_place, fmtTime(f.takeoff_utc), fmtTime(f.landing_utc), f.date_ok ? '' : 'date unknown', f.date_override, f.aircraft, f.aircraft_uid, f.project_name, srcLabel([f]), f.pic, f.pac, f.gcs, f.goal, f.comment, f.reference, f.indoor ? 'indoor' : '', f.optitrack ? 'optitrack' : '', f.takeoff_lat == null ? 'no gps' : '', ...['pic', 'pac', 'gcs'].map(r => f[r + '_user']?.display_name)].join(' ').toLowerCase();

function projectOptions(selected) {
  const addable = projects.filter(p => me && (me.is_admin || p.can_add || p.id === selected));
  return '<option value="">No project</option>' + addable.map(p =>
    `<option value="${p.id}"${p.id === selected ? ' selected' : ''}>${esc(p.name)}</option>`).join('');
}
function projectCell(f) {
  if (!editOn() || !f.can_edit_project) return entityLink('projects', f.project_id, f.project_name || '');
  if (f.manual_id) return `<select onclick="event.stopPropagation()" onchange="setPaperProject(${f.manual_id}, this.value)">${projectOptions(f.project_id).replace('<option value="">No project</option>', '')}</select>`;
  const ids = (f.sources || []).map(s => s.flight_id).join(',');
  return `<select onclick="event.stopPropagation()" onchange="setFlightProject(${f.flight_id}, this.value, [${ids}])">${projectOptions(f.project_id)}</select>`;
}
async function setPaperProject(id, value) {
  if (await updateRecords([`paper:${id}`], {project_id: +value})) loadFlights();
}
async function setFlightProject(id, value, ids) {
  const all = [...new Set([id, ...(ids || [])])];
  for (const fid of all) {
    const r = await fetch('/api/flights/' + fid + '/project', {method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_id: value ? +value : null})});
    if (!r.ok) { alert(((await r.json().catch(() => ({}))).error) || 'Could not save the project'); break; }
  }
  loadFlights();
}

const open_ = new Set();
const coord = (p, name) => p ? `${name ? esc(name) + ' · ' : ''}${p.lat.toFixed(6)}, ${p.lon.toFixed(6)} · ${p.alt_m} m` : '';
const windTxt = w => w ? `${w.speed_ms} m/s from ${w.from_deg}°${w.temperature_c != null ? ', ' + w.temperature_c + ' °C' : ''}` : '';
const ned = v => v ? `N ${v.north}, E ${v.east}, D ${v.down}` : '';
const kv = (k, v) => v == null || v === '' ? '' : `<span class="mute">${k}</span><span>${v}</span>`;

function detail(f) {
  if (f.manual_id) return `<h4>Paper ${f.record_kind === 'daily' ? 'daily summary' : 'flight record'}</h4>
    <p>${f.flight_count} flight(s) · ${fmtDur(f.duration_s)} total. ${f.takeoff_utc.length === 10 ? 'Takeoff time not recorded.' : ''}</p>
    ${f.reference ? `<p>Reference: ${esc(f.reference)}</p>` : ''}
    ${f.comment ? `<p class="note">${esc(f.comment)}</p>` : ''}
    <p class="mute">No telemetry, flight path, distance or software version recorded.</p>
    ${(f.possible_duplicates || []).length ? `<h4>Possible duplicate</h4><p class="mute">Logged flights of this aircraft near this takeoff time. If one is the same flight, link it: it then counts once, as the log.</p><ul>
      ${f.possible_duplicates.map(d => `<li>${esc(fmtTime(d.takeoff_utc))} · ${fmtDur(d.duration_s)} · ${esc(d.aircraft)} <a href="/flight/${d.flight_ids[0]}">open</a>
        ${f.can_edit_record ? `<button type="button" data-link="${f.manual_id}" data-flights="${d.flight_ids.join(',')}" data-same="1">Same flight</button>
        <button type="button" class="sec" data-link="${f.manual_id}" data-flights="${d.flight_ids.join(',')}" data-same="0">Not the same</button>` : ''}</li>`).join('')}</ul>` : ''}
    <a class="btn" href="/historical/${f.manual_id}">${f.can_edit_record ? 'View / edit paper record' : 'View paper record'}</a>`;
  return `<div class="flight-detail">
    <div class="minimap" data-fid="${f.flight_id}" role="status">Loading path...</div>
    <div class="detail-info"><h4>Comment</h4>${f.comment ? `<div class="note">${esc(f.comment)}</div>` : '<span class="mute">No comment</span>'}
      ${linkedInfo(f)}
      <div class="actions"><a class="btn" href="/flight/${f.flight_id}">Open flight page</a>
        ${f.sources.map(s => `<a class="btn sec" href="/api/logs/${s.log_id}/download">Download ${downloadLabel(s.log_type)}</a>`).join('')}</div>
    </div>
  </div>`;
}

// Paper records linked to this logged flight (#35): they count once, as the log; differences are listed.
function linkedInfo(f) {
  if (!(f.linked_records || []).length) return '';
  return `<h4>Paper record</h4><ul>${f.linked_records.map(r => `<li><a href="/historical/${r.id}">${esc(r.reference || 'Paper record ' + r.id)}</a>
      <span class="mute">${r.origin === 'auto' ? 'linked automatically' : 'linked by hand'}</span>
      ${editOn() ? `<button type="button" class="sec" data-link="${r.id}" data-flights="${r.flight_ids.join(',')}" data-same="0">Unlink</button>` : ''}</li>`).join('')}</ul>
    ${(f.conflicts || []).length ? `<p class="warn">The paper record differs from the log; the log value is shown:</p><ul>${f.conflicts.map(c =>
      `<li>${esc(c.field)}: log ${esc(c.log || '-')}, ${esc(c.record)} ${esc(c.paper || '-')}</li>`).join('')}</ul>` : ''}`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-link]');
  if (!b) return;
  b.disabled = true;
  const r = await fetch('/api/links', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({record_id: +b.dataset.link, flight_ids: b.dataset.flights.split(',').map(Number), same: b.dataset.same === '1'})});
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || 'Could not save the link.'); b.disabled = false; return; }
  loadFlights();
});

const pathCache = new Map(), miniMaps = [];
function initMiniMaps() {
  miniMaps.splice(0).forEach(m => m.remove());
  document.querySelectorAll('.minimap').forEach(loadMiniMap);
}
function loadMiniMap(el) {
  const id = +el.dataset.fid;
  if (!pathCache.has(id)) pathCache.set(id, fetch(`/api/flights/${id}/path`).then(async r => {
    if (!r.ok) throw new Error(`Could not load path (${r.status}).`);
    const p = await r.json();
    const points = p.points || p;
    if (!Array.isArray(points)) throw new Error('Invalid path response.');
    const segments = [];
    let segment = null, previous = null;
    for (const point of points) {
      const position = point?.position;
      if (!position || !Number.isFinite(position.lat) || !Number.isFinite(position.lon)
          || Math.abs(position.lat) > 90 || Math.abs(position.lon) > 180
          || (position.lat === 0 && position.lon === 0)) {
        segment = null;
        previous = null;
        continue;
      }
      if (!segment || point.time_s - previous.time_s > 5) {
        segment = [];
        segments.push(segment);
      }
      segment.push([position.lat, position.lon]);
      previous = point;
    }
    return segments;
  }));
  const pending = pathCache.get(id);
  pending.then(segments => {
    if (!el.isConnected) return;
    if (!segments.length) { el.textContent = 'No valid geographic positions in the stored path'; el.className = 'mute'; return; }
    el.textContent = '';
    const first = segments[0][0], last = segments[segments.length - 1].slice(-1)[0];
    const m = L.map(el, {scrollWheelZoom: false}).setView(first, 15);
    miniMaps.push(m);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap contributors'}).addTo(m);
    const group = L.featureGroup().addTo(m);
    for (const segment of segments) {
      if (segment.length > 1) L.polyline(segment, {color: '#1f6feb', weight: 3}).addTo(group);
      else L.circleMarker(segment[0], {radius: 3, color: '#1f6feb', fillOpacity: 1}).addTo(group);
    }
    L.circleMarker(first, {radius: 4, color: '#1f6feb', fillOpacity: .9})
      .bindTooltip('First recorded position').addTo(group);
    L.circleMarker(last, {radius: 4, color: '#1f6feb', fillOpacity: .9})
      .bindTooltip('Last recorded position').addTo(group);
    m.fitBounds(group.getBounds().pad(0.15), {maxZoom: 19});
  }).catch(error => {
    if (pathCache.get(id) === pending) pathCache.delete(id);
    if (!el.isConnected) return;
    el.className = 'mute';
    el.textContent = error.message + ' ';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = 'Retry path';
    retry.onclick = () => {
      el.className = 'minimap';
      el.textContent = 'Loading path...';
      loadMiniMap(el);
    };
    el.appendChild(retry);
  });
}

const km = (a, b) => {
  const r = Math.PI / 180, dLat = (b.takeoff_lat - a.takeoff_lat) * r, dLon = (b.takeoff_lon - a.takeoff_lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.takeoff_lat * r) * Math.cos(b.takeoff_lat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
};
const picKey = f => f.pic_user ? 'u' + f.pic_user.id : 'n' + (f.pic || '').toLowerCase();

function combine(list, radiusKm) {
  const groups = [];
  for (const f of [...list].sort((a, b) => (a.takeoff_utc || '').localeCompare(b.takeoff_utc || ''))) {
    const key = [f.aircraft, picKey(f), fmtDate(f.takeoff_utc), !!f.simulation?.detected].join('|');
    const g = !f.manual_id && f.takeoff_lat != null && groups.find(g => g.key === key && !g.flights[0].manual_id && g.flights[0].takeoff_lat != null && km(g.flights[0], f) <= radiusKm);
    if (g) g.flights.push(f); else groups.push({key, flights: [f]});
  }
  for (const g of groups) {
    const fl = g.flights, last = fl[fl.length - 1];
    g.id = fl[0].record_key;
    g.duration_s = fl.reduce((s, f) => s + (f.duration_s || 0), 0);
    g.distance_m = fl.reduce((s, f) => s + (f.distance_m || 0), 0);
    g.max_from_takeoff_m = fl.reduce((s, f) => Math.max(s, f.max_from_takeoff_m || 0), 0);
    g.landing_utc = last.landing_utc;
    g.landing_lat = last.landing_lat; g.landing_lon = last.landing_lon; g.landing_place = last.landing_place;
    g.landing_place_id = last.landing_place_id;
    const uniq = k => [...new Set(fl.map(f => f[k]).filter(Boolean))];
    g.goals = uniq('goal');
    g.comments = uniq('comment');
  }
  return groups.sort((a, b) => (b.flights[0].takeoff_utc || '').localeCompare(a.flights[0].takeoff_utc || ''));
}

const TYPE_LABEL = {onboard_sd: 'SD', gcs: 'GCS', px4_ulog: 'PX4', ardupilot: 'ArduPilot', mavlink_tlog: 'tlog'};
const downloadLabel = t => ({px4_ulog:'PX4 .ulg', ardupilot:'ArduPilot log', mavlink_tlog:'MAVLink .tlog',
  gcs:'GCS .data + .log', onboard_sd:'SD .data + .log'}[t] || 'log');
const srcLabel = fl => fl.some(f => f.manual_id) ? (fl[0].record_kind === 'daily' ? 'Paper daily total' : 'Paper') + (fl.some(f => f.possible_duplicates?.length) ? ' · possible duplicate' : '')
  : ['onboard_sd', 'px4_ulog', 'ardupilot', 'mavlink_tlog', 'gcs'].filter(t => fl.some(f => (f.sources || []).some(s => s.log_type === t))).map(t => TYPE_LABEL[t]).join(' + ')
    + (fl.some(f => f.linked_records?.length) ? ' + Paper' : '') + (fl.some(f => f.conflicts?.length) ? ' · conflict' : '');
const verdictMark = f => (f.simulation?.detected ? ' <span class="mute">(Simulation)</span>' : '') + (f.verdict === 'ground' ? ' <span class="mute" title="Probably not a real flight">(ground)</span>'
  : f.verdict === 'uncertain' ? ' <span class="mute" title="Unsure whether this was a real flight">(?)</span>' : '')
  + (f.optitrack ? ' <span class="mute" title="OptiTrack or motion-capture pose in this log">(OptiTrack)</span>' : '')
  + (f.indoor && !f.optitrack ? ' <span class="mute" title="Takeoff is inside a named indoor place">(indoor)</span>' : '');
function dateTd(f) {
  const warn = '<span class="badge date-unknown" title="This log has no usable calendar date (often GPS week 0, shown as 1980)">date unknown</span>';
  const label = f.date_ok ? esc(fmtDate(f.takeoff_utc) || f.date_override || '') : warn;
  if (editOn() && f.can_edit_date && (!f.date_ok || f.date_override)) {
    return `<td onclick="event.stopPropagation()">${label}<div class="mute" style="font-weight:400;margin-top:4px">Set date <input type="date" value="${esc(f.date_override || '')}" onchange="setLogDate(${f.log_id}, this.value)"></div></td>`;
  }
  return `<td>${label}</td>`;
}
async function setLogDate(logId, value) {
  const r = await fetch('/api/logs/' + logId + '/date', {method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({date_override: value || null})});
  if (!r.ok) { alert(((await r.json().catch(() => ({}))).error) || 'Could not save the date'); return; }
  loadFlights();
}
const cells = (f, o, landingPlaceId) => `${chk(o.ids, o.canEdit)}${dateTd(f)}<td>${esc(fmtHm(f.takeoff_utc))}</td><td>${esc(fmtHm(o.landing_utc)) || '<span class="mute">–</span>'}</td>
    <td>${o.count}</td><td>${fmtDur(o.duration_s)}</td><td>${fmtDist(o.distance_m)}</td><td>${o.sources}</td><td><span${f.aircraft_uid ? ` title="${esc(f.aircraft_uid)}"` : ''}>${entityLink('aircraft', f.drone_id, f.aircraft)}</span>${verdictMark(f)}</td>
    <td>${o.project}</td>
    <td>${place(f.takeoff_lat, f.takeoff_lon, f.takeoff_place, f.takeoff_place_id)}</td><td>${place(o.landing_lat, o.landing_lon, o.landing_place, landingPlaceId)}</td>
    <td>${crewSelect(f, 'pic', o.ids)}</td><td>${crewSelect(f, 'pac', o.ids)}</td><td>${crewSelect(f, 'gcs', o.ids)}</td><td>${esc(o.goal)}</td><td>${esc(o.comment)}</td>`;

function flightRows(f, cls = '') {
  const ids = crewIds(f);
  return `<tr class="flight ${cls}" data-id="${f.record_key}">${cells(f, {landing_utc: f.landing_utc, count: cls ? '' : (f.flight_count || 1), sources: srcLabel([f]), duration_s: f.duration_s, distance_m: f.distance_m, max_from_takeoff_m: f.max_from_takeoff_m, landing_lat: f.landing_lat, landing_lon: f.landing_lon, landing_place: f.landing_place, goal: f.goal, comment: f.comment, project: projectCell(f), ids, canEdit: f.can_edit_crew}, f.landing_place_id)}</tr>`
    + (open_.has(f.record_key) ? `<tr><td colspan="17" class="detail">${detail(f)}</td></tr>` : '');
}

function groupRows(g) {
  if (g.flights.length === 1) return flightRows(g.flights[0]);
  const first = g.flights[0], isOpen = openGroups.has(g.id);
  const times = g.flights.map(f => `${fmtHm(f.takeoff_utc)}–${fmtHm(f.landing_utc) || '?'}`).join(', ');
  const ids = [...new Set(g.flights.flatMap(crewIds))];
  return `<tr class="group" data-gid="${g.id}" title="${esc(times)}">${cells(first, {landing_utc: g.landing_utc, count: (isOpen ? '▾ ' : '▸ ') + g.flights.length, sources: srcLabel(g.flights), duration_s: g.duration_s, distance_m: g.distance_m, max_from_takeoff_m: g.max_from_takeoff_m, landing_lat: g.landing_lat, landing_lon: g.landing_lon, landing_place: g.landing_place, goal: g.goals.join(', '), comment: g.comments.join(' · '), project: projectCell(first), ids, canEdit: g.flights.every(f => f.can_edit_crew)}, g.landing_place_id)}</tr>`
    + (isOpen ? g.flights.map(f => flightRows(f, 'sub')).join('') : '');
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const shown = flights.filter(f => window.flightFilters.includes(f) && (!q || q.split(/\s+/).every(w => text(f).includes(w))));
  const entries = $('combine').checked ? combine(shown, Math.max(+$('radius').value || 1, 0.1)) : shown.map(f => ({flights: [f], id: f.record_key}));
  const pages = Math.max(1, Math.ceil(entries.length / pageSize));
  page = Math.min(page, pages - 1);
  const visible = entries.slice(page * pageSize, (page + 1) * pageSize);
  $('pageInfo').textContent = `Page ${page + 1} of ${pages}`;
  $('prev').disabled = page === 0;
  $('next').disabled = page >= pages - 1;
  $('rows').innerHTML = visible.map(groupRows).join('');
  document.querySelector('table.log').classList.toggle('editing', editOn());
  const pageIds = [...new Set(visible.flatMap(e => (e.flights || []).filter(f => f.can_edit_crew).flatMap(crewIds)))];
  $('selAll').checked = pageIds.length > 0 && pageIds.every(id => selected.has(id));
  $('selAll').onchange = () => { toggleSel(pageIds, $('selAll').checked); };
  const total = shown.reduce((s, f) => s + (f.duration_s || 0), 0);
  const dist = shown.some(f => f.distance_m != null) ? shown.reduce((s, f) => s + (f.distance_m || 0), 0) : null;
  $('summary').textContent = `${shown.reduce((s, f) => s + (f.flight_count || 1), 0)} flights` + ($('combine').checked ? ` · ${entries.length} records/sessions` : '') + ` · ${fmtDur(total)} · ${dist == null ? 'No recorded distance' : fmtDist(dist) + ' recorded distance'}`;
  initMiniMaps();
  return shown;
}

$('rows').onclick = e => {
  if (e.target.closest('a, button, select, input, textarea')) return;
  const gr = e.target.closest('tr.group');
  if (gr) { const id = gr.dataset.gid; openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id); render(); return; }
  const tr = e.target.closest('tr.flight');
  if (!tr) return;
  const id = tr.dataset.id;
  open_.has(id) ? open_.delete(id) : open_.add(id);
  render();
};

function exportCsv() {
  const cols = ['source_type', 'simulation', 'flight_count', 'record_kind', 'reference', 'takeoff_utc', 'landing_utc', 'duration_s', 'distance_m', 'from_takeoff_m', 'max_from_takeoff_m', 'aircraft', 'aircraft_uid', 'project_name', 'takeoff_place', 'takeoff_lat', 'takeoff_lon', 'landing_place', 'landing_lat', 'landing_lon', 'pic', 'pic_user', 'pac', 'pac_user', 'gcs', 'gcs_user', 'goal', 'comment'];
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [cols.join(',')].concat(render().map(f => cols.map(c => cell(c === 'simulation' ? f.simulation?.detected : c.endsWith('_user') ? f[c]?.display_name : f[c])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'logbook.csv';
  a.click();
}

$('q').oninput = () => { page = 0; render(); };
$('combine').onchange = $('radius').onchange = () => { page = 0; render(); };
window.addEventListener('flightfilterschange', () => { selected.clear(); page = 0; render(); });
window.addEventListener('editchange', toggleEdit);
$('prev').onclick = () => { page--; render(); };
$('next').onclick = () => { page++; render(); };
$('size').onchange = () => { pageSize = +$('size').value; page = 0; render(); };
</script>
</body>
</html>
