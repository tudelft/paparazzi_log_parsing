<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Documents</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --txt:#1d2733; --mute:#6b7785; --acc:#1f6feb; --err:#cf222e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#16202c; color:#fff; padding:14px 24px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header .meta { color:#9fb0c3; font-size:12px; }
  main { width:100%; max-width:960px; margin:0 auto; padding:16px 12px 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .card h2 { margin:0 0 4px; font-size:16px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .text { white-space:pre-wrap; margin:0 0 4px; }
  .doc { display:flex; flex-direction:column; gap:2px; padding:8px 10px; margin-top:8px; border:1px solid var(--line);
    border-left:4px solid var(--acc); border-radius:6px; }
  .doc a.name { font-weight:600; }
  .doc .sub { font-size:12px; color:var(--mute); }
  .none { color:var(--mute); margin:8px 0 0; }
  .tools { margin-left:auto; display:flex; gap:6px; }
  .edit-only { display:none; }
  body.editing .edit-only { display:inline-flex; }
  body.editing div.edit-only { display:flex; }
  #err { color:var(--err); margin-bottom:8px; }
  #err:empty { display:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Documents</h1>
  <span class="meta" id="nav"></span>
  <span class="meta" style="margin-left:auto"><span id="who"></span> <button type="button" id="nightBtn" onclick="toggleNight()"><span class="when-day">Night</span><span class="when-night">Day</span></button> <button class="sec" onclick="logout()">Sign out</button></span>
</header>
<main>
  <div id="err"></div>
  <section class="card" id="introCard">
    <h2 class="edit-only">Text at the top <span class="tools"><button type="button" class="sec" onclick="editIntro()">Edit text</button></span></h2>
    <p class="text" id="intro"></p>
  </section>
  <div class="edit-only row" style="gap:6px;margin-bottom:12px">
    <button type="button" onclick="editDocument()">Add document</button>
    <button type="button" class="sec" onclick="editGroup()">Add group</button>
  </div>
  <div id="shared"><span class="mute">Loading…</span></div>
  <section class="card" id="ownCard">
    <h2>My licences and qualifications <span class="tools"><a href="/account">Change them under My account</a></span></h2>
    <div id="own"></div>
  </section>
</main>

<dialog class="entry-dialog" id="introDialog" aria-labelledby="introTitle" onkeydown="if(event.key==='Escape'){event.preventDefault();this.close();}">
  <form id="introForm">
    <div class="dialog-header"><h2 id="introTitle">Text at the top</h2><button type="button" class="sec" onclick="$('introDialog').close()">Close</button></div>
    <label class="field">Text (plain text, shown to everyone who opens Documents)<textarea name="intro" rows="8" maxlength="5000"></textarea></label>
    <p class="dialog-error" id="introError" role="alert"></p>
    <div class="row"><button type="submit">Save</button> <button type="button" class="sec" onclick="$('introDialog').close()">Cancel</button></div>
  </form>
</dialog>
<dialog class="entry-dialog" id="groupDialog" aria-labelledby="groupTitle" onkeydown="if(event.key==='Escape'){event.preventDefault();this.close();}">
  <form id="groupForm">
    <div class="dialog-header"><h2 id="groupTitle">Group</h2><button type="button" class="sec" onclick="$('groupDialog').close()">Close</button></div>
    <label class="field">Name<input name="name" required maxlength="80"></label>
    <label class="field">Text<textarea name="description" maxlength="1000"></textarea></label>
    <label class="field">Order (low first)<input name="sort_order" type="number" step="1" value="0"></label>
    <p class="dialog-error" id="groupError" role="alert"></p>
    <div class="row"><button type="submit">Save</button> <button type="button" class="danger" id="groupDeleteBtn" onclick="removeGroup()">Delete</button> <button type="button" class="sec" onclick="$('groupDialog').close()">Cancel</button></div>
  </form>
</dialog>
<dialog class="entry-dialog" id="docDialog" aria-labelledby="docTitle" onkeydown="if(event.key==='Escape'){event.preventDefault();this.close();}">
  <form id="docForm">
    <div class="dialog-header"><h2 id="docTitle">Document</h2><button type="button" class="sec" onclick="$('docDialog').close()">Close</button></div>
    <label class="field">Title<input name="title" required maxlength="120"></label>
    <label class="field">Description<textarea name="description" maxlength="1000"></textarea></label>
    <div class="two">
      <label class="field">Group<select name="group_id"></select></label>
      <label class="field" title="Only people with a current approved qualification of this type see the document">Visible to<select name="type_id"></select></label>
    </div>
    <label class="field">Order (low first)<input name="sort_order" type="number" step="1" value="0"></label>
    <label class="field" id="fileField">File<input name="file" type="file"></label>
    <p class="dialog-error" id="docError" role="alert"></p>
    <div class="row"><button type="submit">Save</button> <button type="button" class="danger" id="docDeleteBtn" onclick="removeDocument()">Delete</button> <button type="button" class="sec" onclick="$('docDialog').close()">Cancel</button></div>
  </form>
</dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, data = null, editingId = null;
const editing = () => !!(me && me.is_admin && window.editMode && window.editMode());

function docHTML(d) {
  const link = d.viewable ? d.view : d.download;
  const sub = [d.type_name ? 'visible to: ' + esc(d.type_name) : '', esc(d.filename), `<a href="${esc(d.download)}">download</a>`]
    .filter(Boolean).join(' · ');
  return `<div class="doc"><span style="display:flex;gap:8px"><a class="name" href="${esc(link)}" target="_blank" rel="noopener">${esc(d.title)}</a>`
    + `<span class="tools edit-only"><button type="button" class="sec" onclick="editDocument(${d.id})">Edit</button></span></span>`
    + (d.description ? `<span class="text">${esc(d.description)}</span>` : '')
    + `<span class="sub">${sub}</span></div>`;
}
function ownHTML(q) {
  const sub = [q.number ? 'No. ' + esc(q.number) : '', q.valid_until ? 'valid until ' + esc(q.valid_until) : 'no expiry date',
    q.download ? `<a href="${esc(q.download)}">download</a>` : 'no document'].filter(Boolean).join(' · ');
  const name = q.view ? `<a class="name" href="${esc(q.view)}" target="_blank" rel="noopener">${esc(q.type)}</a>` : `<b>${esc(q.type)}</b>`;
  return `<div class="doc">${name}<span class="sub">${sub}</span></div>`;
}
function paint() {
  document.body.classList.toggle('editing', editing());
  $('intro').textContent = data.intro || '';
  $('introCard').hidden = !data.intro && !editing();
  const docs = data.documents, html = [];
  const loose = docs.filter(d => d.group_id == null);
  if (loose.length) html.push(`<section class="card">${loose.map(docHTML).join('')}</section>`);
  for (const g of data.groups) {
    const mine = docs.filter(d => d.group_id === g.id);
    if (!mine.length && !editing()) continue;
    html.push(`<section class="card"><h2>${esc(g.name)}<span class="tools edit-only"><button type="button" class="sec" onclick="editGroup(${g.id})">Edit group</button></span></h2>`
      + (g.description ? `<p class="text">${esc(g.description)}</p>` : '')
      + (mine.length ? mine.map(docHTML).join('') : '<p class="none">No documents in this group.</p>') + '</section>');
  }
  $('shared').innerHTML = html.join('') || '<p class="none" style="margin-bottom:12px">No shared documents yet.</p>';
  $('own').innerHTML = data.qualifications.length ? data.qualifications.map(ownHTML).join('')
    : '<p class="none">No current approved licences or qualifications.</p>';
}
async function load() {
  const r = await fetch('/api/documents');
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  data = d;
  paint();
}
async function send(url, method, body, errorBox) {
  const isForm = body instanceof FormData;
  const r = await fetch(url, {method, body: isForm ? body : JSON.stringify(body),
    headers: isForm ? {} : {'Content-Type': 'application/json'}});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $(errorBox).textContent = d.error || r.statusText; return false; }
  await load();
  return true;
}
function editIntro() {
  $('introForm').intro.value = data.intro || '';
  $('introError').textContent = '';
  $('introDialog').showModal();
}
$('introForm').onsubmit = async e => {
  e.preventDefault();
  if (await send('/api/admin/documents/intro', 'PUT', {intro: $('introForm').intro.value}, 'introError')) $('introDialog').close();
};
function editGroup(id) {
  const g = data.groups.find(x => x.id === id) || {name: '', description: '', sort_order: 0};
  editingId = id ?? null;
  const f = $('groupForm');
  f.name.value = g.name; f.description.value = g.description; f.sort_order.value = g.sort_order;
  $('groupDeleteBtn').hidden = editingId == null;
  $('groupError').textContent = '';
  $('groupDialog').showModal();
}
$('groupForm').onsubmit = async e => {
  e.preventDefault();
  const f = $('groupForm');
  const body = {name: f.name.value, description: f.description.value, sort_order: parseInt(f.sort_order.value || '0', 10)};
  const ok = editingId == null ? await send('/api/admin/document-groups', 'POST', body, 'groupError')
    : await send(`/api/admin/document-groups/${editingId}`, 'PUT', body, 'groupError');
  if (ok) $('groupDialog').close();
};
async function removeGroup() {
  if (confirm('Delete this group?') && await send(`/api/admin/document-groups/${editingId}`, 'DELETE', {}, 'groupError'))
    $('groupDialog').close();
}
function editDocument(id) {
  const d = data.documents.find(x => x.id === id) || {title: '', description: '', group_id: null, type_id: null, sort_order: 0};
  editingId = id ?? null;
  const f = $('docForm');
  f.group_id.innerHTML = '<option value="">(no group, at the top)</option>'
    + data.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
  f.type_id.innerHTML = '<option value="">Everyone signed in</option>'
    + (data.types || []).map(t => `<option value="${t.id}">Only with ${esc(t.name)}</option>`).join('');
  f.title.value = d.title; f.description.value = d.description; f.sort_order.value = d.sort_order;
  f.group_id.value = d.group_id ?? ''; f.type_id.value = d.type_id ?? '';
  f.file.value = '';
  $('fileField').hidden = editingId != null;
  $('docDeleteBtn').hidden = editingId == null;
  $('docError').textContent = '';
  $('docDialog').showModal();
}
$('docForm').onsubmit = async e => {
  e.preventDefault();
  const f = $('docForm');
  let ok;
  if (editingId == null) {
    if (!f.file.files.length) { $('docError').textContent = 'Choose a file.'; return; }
    ok = await send('/api/admin/documents', 'POST', new FormData(f), 'docError');
  } else {
    ok = await send(`/api/admin/documents/${editingId}`, 'PUT', {title: f.title.value, description: f.description.value,
      group_id: f.group_id.value || null, type_id: f.type_id.value || null, sort_order: parseInt(f.sort_order.value || '0', 10)}, 'docError');
  }
  if (ok) $('docDialog').close();
};
async function removeDocument() {
  if (confirm('Delete this document and its file?') && await send(`/api/admin/documents/${editingId}`, 'DELETE', {}, 'docError'))
    $('docDialog').close();
}
window.addEventListener('editchange', () => { if (data) paint(); });
fetch('/api/me').then(r => r.json()).then(d => {
  me = d.user;
  $('who').textContent = d.user.display_name + (d.user.is_admin ? ' (admin)' : '');
  return load();
}).catch(e => { $('err').textContent = e.message; });
</script>
</body>
</html>
