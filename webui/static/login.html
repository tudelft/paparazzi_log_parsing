<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in - Paparazzi log database</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f5f6f8; font:14px/1.45 system-ui, sans-serif; color:#1d2733; }
  form { background:#fff; border:1px solid #dfe3e8; border-radius:8px; padding:28px; width:320px; }
  h1 { font-size:18px; margin:0 0 18px; }
  label { display:block; margin-bottom:12px; font-size:12px; color:#6b7785; }
  input { width:100%; margin-top:4px; padding:8px; font:inherit; border:1px solid #c5ccd5; border-radius:6px; }
  button { width:100%; padding:9px; font:inherit; background:#1f6feb; color:#fff; border:0; border-radius:6px; cursor:pointer; }
  #err { color:#cf222e; min-height:1.4em; margin-bottom:8px; }
</style>
</head>
<body>
<form id="f">
  <h1>Paparazzi log database</h1>
  <label>Username<input name="username" autocomplete="username" autofocus required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <div id="err"></div>
  <button>Sign in</button>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})});
  if (r.ok) { location.href = '/'; return; }
  document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error || 'login failed';
};
</script>
</body>
</html>
