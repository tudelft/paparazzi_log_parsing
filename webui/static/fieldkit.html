<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --txt:#1d2733; --mute:#6b7785; --acc:#1f6feb; --err:#cf222e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#16202c; color:#fff; padding:14px 24px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header .meta { color:#9fb0c3; font-size:12px; }
  main { width:100%; margin:0; padding:16px 12px 20px; }
  .blocks { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:12px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .card h2 { margin:0 0 8px; font-size:16px; }
  .doc { display:flex; flex-direction:column; gap:2px; padding:8px 10px; margin-top:8px; border:1px solid var(--line);
    border-left:4px solid var(--acc); border-radius:6px; }
  .doc a.name { font-weight:600; }
  .doc .sub { font-size:12px; color:var(--mute); }
  .none { color:var(--mute); margin-top:8px; }
  #err { color:var(--err); margin-bottom:8px; }
  #err:empty { display:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Field kit</h1>
  <span class="meta" id="nav"></span>
  <span class="meta" style="margin-left:auto"><span id="who"></span> <button type="button" id="nightBtn" onclick="toggleNight()"><span class="when-day">Night</span><span class="when-night">Day</span></button> <button class="sec" onclick="logout()">Sign out</button></span>
</header>
<main>
  <div id="err"></div>
  <p class="mute" style="margin:0 0 12px">The documents to show when you are asked for them in the field, for example by the police.
    Open this page on your phone before you fly.</p>
  <div class="blocks">
    <section class="card" id="pilotCard">
      <h2>Pilot</h2>
      <div id="pilot"><span class="mute">Loading…</span></div>
    </section>
    <section class="card" id="companyCard">
      <h2>Company</h2>
      <p class="none">Insurance, operator registration and operations approval: coming soon.</p>
    </section>
    <section class="card" id="manualsCard">
      <h2>Manuals</h2>
      <p class="none">The Operations Manual: coming soon.</p>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function doc(title, q) {
  const sub = [q.number ? 'No. ' + esc(q.number) : '', q.valid_until ? 'valid until ' + esc(q.valid_until) : 'no expiry date']
    .filter(Boolean).join(' · ');
  return `<div class="doc"><a class="name" href="${esc(q.view)}" target="_blank" rel="noopener">${esc(title)}</a>`
    + `<span class="sub">${sub} · <a href="${esc(q.download)}">download</a></span></div>`;
}
function paint(d) {
  const p = d.pilot;
  let html = `<div><b>${esc(p.name)}</b></div>`;
  html += p.licence ? doc('Drone licence ' + p.licence.type, p.licence)
    : '<p class="none">No valid drone licence (STS, A2 or A1/A3) with a document. Add it under <a href="/account">My account</a> → My qualifications.</p>';
  if (p.rt) html += doc('RT licence', p.rt);
  $('pilot').innerHTML = html;
}
fetch('/api/me').then(r => r.json()).then(async d => {
  $('who').textContent = d.user.display_name + (d.user.is_admin ? ' (admin)' : '');
  const r = await fetch('/api/fieldkit');
  const k = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(k.error || r.statusText);
  paint(k);
}).catch(e => { $('err').textContent = e.message; });
</script>
</body>
</html>
