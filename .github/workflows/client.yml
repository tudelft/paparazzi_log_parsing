# Tests the Python package mavlab-logbook-client (python/mavlab-logbook-client/) on Linux, macOS and Windows.
# Publishing: when master has a mavlab_logbook_client.__version__ without a tag "client-v<version>", the publish job
# waits for a maintainer to approve the "pypi" environment, uploads that version to PyPI by trusted publishing and
# then creates the tag. Nothing else publishes; to release, bump __version__ in a reviewed pull request and approve
# the run after merging. A rejected or expired run is retried by re-running it (or starting this workflow on master).
# Published versions and tags are never changed: a change to the package needs a new version.
# PyPI: the project's trusted publisher is this repository, workflow client.yml, environment "pypi".
name: Python client

on:
  push:
    branches: [master]
    paths: ["python/mavlab-logbook-client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["python/mavlab-logbook-client/**", ".github/workflows/client.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s python/mavlab-logbook-client/tests -v

  # Decides without an approval request whether there is anything to publish
  check:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Is the package version new?
        run: |
          set -eu
          version=$(python3 -c "import ast; t = ast.parse(open('python/mavlab-logbook-client/mavlab_logbook_client/__init__.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/client-v$version" >/dev/null; then
            echo "client-v$version already released"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "client-v$version is new"; echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mavlab-logbook-client
    # At most one run waits for approval; a newer master run replaces an older waiting one
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      contents: write   # create the client-v<version> tag
      id-token: write   # PyPI trusted publishing
    env:
      TAG: client-v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check again after approval
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG was released while this run waited"; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build python/mavlab-logbook-client
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/mavlab-logbook-client/dist
          skip-existing: true   # a re-run after a failed tag push only adds the tag
      - name: Tag the release
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Python client ${TAG#client-v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
