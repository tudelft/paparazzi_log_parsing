# Tests the Python package mavlab-logbook-client (python/mavlab-logbook-client/) on Linux, macOS and Windows.
# Publishing: when master has a mavlab_logbook_client.__version__ that is not on PyPI yet, the publish job waits for a
# maintainer to approve the "pypi" environment, uploads that version to PyPI by trusted publishing and then creates
# the tag "client-v<version>" (a published version without its tag only gets the tag). Nothing else publishes; to release, bump __version__ in a reviewed pull request and approve
# the run after merging. A rejected or expired run is retried by re-running it (or starting this workflow on master).
# Published versions and tags are never changed: a change to the package needs a new version.
# PyPI: the project's trusted publisher is this repository, workflow client.yml, environment "pypi".
name: Python client

on:
  push:
    branches: [master]
    paths: ["python/mavlab-logbook-client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["python/mavlab-logbook-client/**", ".github/workflows/client.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s python/mavlab-logbook-client/tests -v

  # Decides without an approval request whether there is anything to do: a version not on PyPI yet, or (after a failed
  # tag push) a published version without its tag. PyPI decides, so a tag pushed by hand cannot skip a publish.
  check:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      todo: ${{ steps.version.outputs.todo }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Is the package version new?
        run: |
          set -eu
          version=$(python3 -c "import ast; t = ast.parse(open('python/mavlab-logbook-client/mavlab_logbook_client/__init__.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/mavlab-logbook-client/$version/json")
          case "$code" in 200) on_pypi=true ;; 404) on_pypi=false ;; *) echo "::error::PyPI answered $code"; exit 1 ;; esac
          tagged=false
          if git ls-remote --exit-code --tags origin "refs/tags/client-v$version" >/dev/null; then tagged=true; fi
          echo "$version: on PyPI $on_pypi, tagged $tagged"
          if [ "$on_pypi" = true ] && [ "$tagged" = true ]; then echo "todo=false"; else echo "todo=true"; fi >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.todo == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mavlab-logbook-client
    # One publish job at a time: a run waiting for approval keeps its place, and of the runs queued behind it only the
    # newest is kept (it ends quietly if the version was released meanwhile)
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      contents: write   # create the client-v<version> tag
      id-token: write   # PyPI trusted publishing
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: client-v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: again
        name: Check again after approval
        run: |
          set -eu
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/mavlab-logbook-client/$VERSION/json")
          case "$code" in 200) echo "on_pypi=true" ;; 404) echo "on_pypi=false" ;; *) echo "::error::PyPI answered $code"; exit 1 ;; esac >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "tagged=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.again.outputs.on_pypi != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        if: steps.again.outputs.on_pypi != 'true'
        run: |
          python -m pip install build
          python -m build python/mavlab-logbook-client
      - if: steps.again.outputs.on_pypi != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/mavlab-logbook-client/dist
          skip-existing: true   # released by another run in the meantime
      - name: Tag the release
        if: steps.again.outputs.tagged != 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Python client $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - if: steps.again.outputs.on_pypi == 'true' && steps.again.outputs.tagged == 'true'
        run: echo "::notice::$TAG was released while this run waited; nothing to do"
